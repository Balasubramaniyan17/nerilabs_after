version: '3.8'

services:
  nerilabs-saas-platform:
    build: .
    container_name: nerilabs_experimentation_saas
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=4
      - APP_BASE_URL=http://localhost:8000
      - DATABASE_PATH=/data/nerilabs_saas_platform.db
      - JWT_SECRET=production-secure-hmac-sha256-secret-key-2026
      - TOKEN_EXPIRATION_SECONDS=3600
      - STRIPE_API_KEY=sk_live_mock_stripe_key
      - STRIPE_WEBHOOK_SECRET=whsec_mock_stripe_webhook_secret
    volumes:
      - nerilabs_db_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nerilabs_db_data:
    driver: local
