version: '3.8'

services:
  nerilabs-saas-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nerilabs_app
    restart: always
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=4
      - DATABASE_PATH=/data/nerilabs_saas_platform.db
      - APP_BASE_URL=${APP_BASE_URL:-https://app.yourdomain.com}
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_EXPIRATION_SECONDS=${TOKEN_EXPIRATION_SECONDS:-3600}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - nerilabs_db_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: nerilabs_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      nerilabs-saas-platform:
        condition: service_healthy

volumes:
  nerilabs_db_data:
    driver: local
